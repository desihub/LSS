
# file parameters for holi pipeline

#
# GENERAL PARAMETERS
#

# actualy holi pipeline always used a local version of LSS package
# NOTE: must include LSS at the end
LSS_dir = "/global/cfs/cdirs/desi/users/colley/LSS"
TARGET_dir= "/global/cfs/cdirs/desi/users/colley/v3_target/desitarget"

# output directory of holi pipeline
# will content seed0000 and altmtl0000 directories
# /global/cfs/cdirs/desi/mocks/fa4acm/holi/webjax_v4.80
#mock_dir = "/pscratch/sd/j/jcolley/holi_fits"
#mock_dir = "/global/cfs/cdirs/desi/mocks/opti_holi1"
mock_dir = "/pscratch/sd/j/jcolley/test_fits3"

# log directory
logs_dir = "/global/homes/j/jcolley/test/runs"

# reference simulation directory
input_ref = "/global/cfs/cdirs/desi/mocks/cai/holi/webjax_v4.80"

# First id seed processing by pipeline
first_id = 90

# for debug, reduce number of galaxy for fast processing,
# minimal value is 5000 else error can appears
# no limitation with value <0, like -1
max_gal = -1

#
# STEP PARAMETERS
#

[prepare_mocks] # step 1
#specdata = "loa-v1"
# example of prepare_mocks parameters, can be completed if necessary
survey = "DA2"

[brickmask] # step 3
cfitsio = "/global/common/software/desi/users/naimgk/cfitsio"
exe_dir = "/global/cfs/cdirs/desi/users/colley/wd_brick/brickmask_mpi"
conf_dir = "/global/cfs/cdirs/desi/users/colley/LSS/scripts/mock_tools/holi_pipeline"

[init_amtl] # step 7
#amtl_dir = ""
# NOTE: keep this small and independent of SLURM cpus-per-task.
# step 7 (mtl.make_ledger) already runs NTASKS seeds in parallel (one per
# srun task); each one additionally spawns its own internal multiprocessing
# pool of this size. Using cpus-per-task (e.g. 15) here means
# NTASKS*nproc workers compete for node memory at once (desitarget's
# make_ledger docstring already warns numproc>12 can OOM for a *single*
# instance), which causes "worker process N killed by signal 9".
# Perlmutter CPU node: 512GB / NTASKS=17 ~= 29GB per task budget.
nproc = 3

[amtl] # step 8
# verbose mode is '--verbose', by default ''
#verbose='--verbose'

# select desi/desi_environment.sh version 
desi_env_vers = '26.3'
